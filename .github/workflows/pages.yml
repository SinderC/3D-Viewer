name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Building OCCT takes ~20-30 min; it only reruns when the pinned versions or build script change.
      - name: Cache Emscripten SDK and OCCT
        id: deps
        uses: actions/cache@v6
        with:
          path: |
            wasm/.emsdk
            wasm/.deps/occt-install-*
          key: occt-${{ runner.os }}-${{ hashFiles('wasm/scripts/env.sh', 'wasm/scripts/setup-emsdk.sh', 'wasm/scripts/build-occt.sh') }}

      - name: Build Emscripten SDK and OCCT
        if: steps.deps.outputs.cache-hit != 'true'
        run: wasm/scripts/setup-emsdk.sh && wasm/scripts/build-occt.sh

      - name: Cache JT reader dependencies
        id: jtdeps
        uses: actions/cache@v6
        with:
          path: |
            wasm/.deps/pyopenjt
            wasm/.deps/xz-install-*
          key: jt-${{ runner.os }}-${{ hashFiles('wasm/scripts/env.sh', 'wasm/scripts/build-jt-deps.sh', 'wasm/patches/**') }}

      - name: Build JT reader dependencies
        if: steps.jtdeps.outputs.cache-hit != 'true'
        run: wasm/scripts/build-jt-deps.sh

      - name: Build WASM bridge
        run: wasm/scripts/build-bridge.sh

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build web app
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
